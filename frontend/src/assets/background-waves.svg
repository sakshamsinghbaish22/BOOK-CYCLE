<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients based on Luca Davincci Palette -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#380304" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#222B31" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a0d10" stop-opacity="1"/>
    </radialGradient>

    <linearGradient id="crimsonWave1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E22227"/>
      <stop offset="45%" stop-color="#C7080C"/>
      <stop offset="85%" stop-color="#6C0102"/>
      <stop offset="100%" stop-color="#440101"/>
    </linearGradient>

    <linearGradient id="crimsonWave2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff3338"/>
      <stop offset="30%" stop-color="#E22227"/>
      <stop offset="70%" stop-color="#800203"/>
      <stop offset="100%" stop-color="#300101"/>
    </linearGradient>

    <linearGradient id="slateWave1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#151b1f"/>
      <stop offset="50%" stop-color="#222B31"/>
      <stop offset="100%" stop-color="#3a474f"/>
    </linearGradient>

    <linearGradient id="slateWave2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0d1114"/>
      <stop offset="40%" stop-color="#1a2227"/>
      <stop offset="80%" stop-color="#2c373f"/>
      <stop offset="100%" stop-color="#55666E"/>
    </linearGradient>

    <linearGradient id="goldSphere" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#ffe699"/>
      <stop offset="40%" stop-color="#e5a93c"/>
      <stop offset="100%" stop-color="#996312"/>
    </linearGradient>

    <!-- Drop Shadows for 3D papercut depth -->
    <filter id="shadowHeavy" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="15" stdDeviation="25" flood-color="#000000" flood-opacity="0.85"/>
    </filter>

    <filter id="shadowMedium" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#200001" flood-opacity="0.75"/>
    </filter>

    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Base Canvas -->
  <rect width="100%" height="100%" fill="url(#bgGlow)"/>

  <!-- Left Side Organic Flowing Crimson Wave Layers -->
  <path d="M-100 -50 C 250 80, 150 400, -80 600 C -180 720, -100 1150, -100 1150 L -200 1150 L -200 -50 Z" 
        fill="#330001" filter="url(#shadowHeavy)"/>

  <path d="M-150 -100 C 320 50, 480 320, 220 560 C 20 740, 310 980, 120 1180 L -200 1180 L -200 -100 Z" 
        fill="url(#crimsonWave1)" filter="url(#shadowHeavy)"/>

  <path d="M-120 100 C 180 200, 360 380, 180 620 C 60 780, 240 940, 80 1120 L -200 1120 L -200 100 Z" 
        fill="url(#crimsonWave2)" filter="url(#shadowMedium)"/>

  <path d="M-100 280 C 120 340, 240 460, 140 680 C 80 800, 160 920, 40 1080 L -200 1080 L -200 280 Z" 
        fill="#ff2227" opacity="0.35" filter="url(#shadowMedium)"/>

  <!-- Right Side Organic Sculpted Slate & Charcoal Wave Layers -->
  <path d="M 2050 -100 C 1650 150, 1550 480, 1780 750 C 1950 950, 1800 1180, 1800 1180 L 2100 1180 L 2100 -100 Z" 
        fill="url(#slateWave1)" filter="url(#shadowHeavy)"/>

  <path d="M 2100 120 C 1720 280, 1620 520, 1820 800 C 1980 1020, 1850 1150, 1850 1150 L 2150 1150 L 2150 120 Z" 
        fill="url(#slateWave2)" filter="url(#shadowMedium)"/>

  <!-- Center-Bottom Swirling Topographic Crimson Ribbon -->
  <path d="M 400 1150 C 700 920, 1100 980, 1450 1150 Z" 
        fill="url(#crimsonWave1)" opacity="0.8" filter="url(#shadowHeavy)"/>

  <path d="M 550 1150 C 800 980, 1050 1020, 1300 1150 Z" 
        fill="#ff2a30" opacity="0.4" filter="url(#shadowMedium)"/>

  <!-- Top-Right Sculpted Contour Ridge -->
  <path d="M 1300 -100 C 1450 120, 1750 180, 2050 50 L 2050 -100 Z" 
        fill="url(#slateWave1)" opacity="0.6" filter="url(#shadowHeavy)"/>

  <!-- Topographic Organic Contour Lines -->
  <path d="M -80 320 C 260 220, 420 440, 200 680 C 40 850, 280 1020, 100 1150" 
        stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" fill="none"/>

  <path d="M -60 380 C 220 300, 380 480, 180 720 C 20 880, 240 1040, 80 1150" 
        stroke="rgba(226, 34, 39, 0.35)" stroke-width="1.2" fill="none"/>

  <path d="M 1720 180 C 1520 380, 1500 580, 1750 820" 
        stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" fill="none"/>

  <path d="M 1780 220 C 1580 420, 1560 620, 1800 860" 
        stroke="rgba(85, 102, 110, 0.4)" stroke-width="1.2" fill="none"/>

  <!-- Golden Spheres from reference image (Luca Davincci Topaz Pearls) -->
  <circle cx="960" cy="180" r="16" fill="url(#goldSphere)" filter="url(#glowGold)"/>
  <circle cx="956" cy="176" r="4" fill="#ffffff" opacity="0.7"/>

  <circle cx="1720" cy="490" r="22" fill="url(#goldSphere)" filter="url(#glowGold)"/>
  <circle cx="1714" cy="484" r="6" fill="#ffffff" opacity="0.7"/>

  <circle cx="1020" cy="980" r="14" fill="url(#goldSphere)" filter="url(#glowGold)"/>
  <circle cx="1016" cy="976" r="3.5" fill="#ffffff" opacity="0.7"/>

  <!-- Gold Glitter / Speckle Particles Cluster -->
  <g fill="#ffd270" opacity="0.65">
    <circle cx="1680" cy="120" r="2.5"/>
    <circle cx="1710" cy="100" r="1.8"/>
    <circle cx="1660" cy="140" r="3.2"/>
    <circle cx="1740" cy="130" r="2.0"/>
    <circle cx="1695" cy="160" r="1.5"/>
    <circle cx="1760" cy="90" r="2.8"/>
    <circle cx="1725" cy="175" r="3.5"/>
    <circle cx="1650" cy="110" r="1.5"/>
    <circle cx="1780" cy="140" r="2.2"/>
    
    <circle cx="180" cy="850" r="2.5"/>
    <circle cx="210" cy="880" r="3.2"/>
    <circle cx="150" cy="890" r="1.8"/>
    <circle cx="230" cy="830" r="2.0"/>
    <circle cx="190" cy="920" r="2.8"/>
    <circle cx="250" cy="900" r="1.5"/>

    <circle cx="280" cy="960" r="2.5"/>
    <circle cx="320" cy="940" r="3.0"/>
  </g>
</svg>
